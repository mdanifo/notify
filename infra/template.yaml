AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Shared notification infrastructure for the personal projects. Owns the single
  operational-alarms SNS topic that every project's CloudWatch alarms publish
  run failures to, plus the SSM pointer projects read to find it. Non-secret
  resources only; the SMTP credentials stay out-of-band SecureStrings. See
  infra/README.md.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "^[a-zA-Z0-9-]+$"
    Description: >
      Deployment stage (e.g. dev, prod). Part of the topic name and the
      /shared/<Stage>/ SSM path, so separate stages don't collide.

  OperatorEmail:
    Type: String
    AllowedPattern: "^[^@]+@[^@]+\\.[^@]+$"
    ConstraintDescription: Must look like an email address.
    Description: >
      Where operational alarms from every project are emailed. One subscription
      for all projects: after the first deploy, confirm it once from the email
      SNS sends. Unrelated to a project's ALERT_EMAIL_TO, which receives that
      project's own emails.

Resources:
  # The topic every project's alarms fan into; a new project only has to point
  # its alarms here.
  AlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "personal-alarms-${Stage}"
      DisplayName: Personal projects operational alarms

  AlarmsTopicSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmsTopic
      Protocol: email
      Endpoint: !Ref OperatorEmail

  # The pointer each project reads instead of hardcoding the ARN: a template
  # declares an AWS::SSM::Parameter::Value<String> parameter defaulting to
  # /shared/<Stage>/alarms-topic-arn, resolved at deploy time. Same
  # /shared/<Stage>/ convention as the SMTP credentials.
  AlarmsTopicArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/shared/${Stage}/alarms-topic-arn"
      Type: String
      Value: !Ref AlarmsTopic
      Description: >
        ARN of the shared operational-alarms SNS topic, owned by the
        shared-alarms CloudFormation stack. Projects read this to route their
        CloudWatch alarms to the shared topic.

Outputs:
  AlarmsTopicArn:
    Description: Shared operational-alarms SNS topic ARN.
    Value: !Ref AlarmsTopic
  AlarmsTopicArnParameterName:
    Description: SSM parameter name each project reads to find the shared topic.
    Value: !Sub "/shared/${Stage}/alarms-topic-arn"
