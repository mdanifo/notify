AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Shared notification infrastructure for the personal projects (notify#6). Owns
  the single operational-alarms SNS topic that every project's CloudWatch alarms
  publish run failures to, instead of a per-project topic + subscription, plus
  the SSM pointer projects read to find it. Non-secret resources only; the SMTP
  credentials stay out-of-band SecureStrings. See infra/README.md.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "^[a-zA-Z0-9-]+$"
    Description: >
      Deployment stage (e.g. dev, prod). Part of the topic name and the
      /shared/<Stage>/ SSM path, so separate stages don't collide.

  OperatorEmail:
    Type: String
    AllowedPattern: "^[^@]+@[^@]+\\.[^@]+$"
    ConstraintDescription: Must look like an email address.
    Description: >
      Where operational alarms from EVERY project are emailed — you, being told
      that one of the systems broke. One subscription for all projects: after
      the first deploy, confirm it once from the email SNS sends. Unrelated to
      any project's ALERT_EMAIL_TO (who receives that project's actual product
      emails).

Resources:
  # The one topic every project's alarms fan into. Kept intentionally generic
  # (not project-specific) so any new project just points its alarms here.
  AlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "personal-alarms-${Stage}"
      DisplayName: Personal projects operational alarms

  AlarmsTopicSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmsTopic
      Protocol: email
      Endpoint: !Ref OperatorEmail

  # The pointer each project reads to find the shared topic without hardcoding
  # its ARN: their templates declare an AWS::SSM::Parameter::Value<String>
  # parameter defaulting to /shared/<Stage>/alarms-topic-arn, which resolves to
  # this value at deploy time. Kept under the same /shared/<Stage>/ convention
  # as the shared SMTP credentials.
  AlarmsTopicArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/shared/${Stage}/alarms-topic-arn"
      Type: String
      Value: !Ref AlarmsTopic
      Description: >
        ARN of the shared operational-alarms SNS topic, owned by the
        shared-alarms CloudFormation stack (notify/infra). Projects read this to
        route their CloudWatch alarms to the shared topic.

Outputs:
  AlarmsTopicArn:
    Description: Shared operational-alarms SNS topic ARN.
    Value: !Ref AlarmsTopic
  AlarmsTopicArnParameterName:
    Description: SSM parameter name each project reads to find the shared topic.
    Value: !Sub "/shared/${Stage}/alarms-topic-arn"
